"Foundations~PM role, lifecycle, desirability/feasibility/viability~Atlassian guide; Mind the Product; Marty Cagan~Set up tracker; block 10–15 weekly hours|Read Atlassian PM guide; define PM vs project mgmt, marketing, UX, engineering|Map discovery→validation→delivery→launch→measurement→iteration; explain D/F/V|Watch a Marty Cagan talk; 3 lessons + 1 question|Pick 3 Nigerian products: audience, problem, value prop, model, 1 unknown|Build teardown template + Notion portfolio|Publish transition announcement; record baselines",

 <div class="c"><b class="s">Week ${wk+1} scorecard</b><div class="row" style="margin-top:8px">${ch(hrs+'h of 10–15',hrs>=10)}${ch(ps+' posts (min 3)',ps>=3)}${ch(xs+' interactions (2–5)',xs>=2)}${ch('Saturday build '+(fr(Math.min(N-1,a0+2))>=.66?'done':'pending'),fr(Math.min(N-1,a0+2))>=.66)}</div></div>
 ${rem()}`}
function rem(){const ok='Notification' in window;return`<div class="c"><b class="s">Daily reminder</b><p class="mu" style="margin:4px 0 8px">Browser notification at your chosen time. Works only while this page is open in a tab; for reliable alerts also add a recurring phone alarm.</p><div class="row"><input type="time" id="rt" value="${localStorage.getItem('pmrt')||'19:00'}" style="width:130px"><button class="b" data-a="rem">${ok?'Enable reminder':'Not supported'}</button></div></div>`}
function plan(){let c='';const off=(dt(0).getDay()+6)%7;let h='<div class="hm">'+['M','T','W','T','F','S','S'].map(l=>`<div class="mu s" style="text-align:center">${l}</div>`).join('')+'<div></div>'.repeat(off);
 for(let i=0;i<N;i++){const f=fr(i);h+=`<button data-a="go" data-v="${i}" class="${i==TI?'today':''}" style="background:${f?`color-mix(in srgb,var(--ac) ${Math.round(f*100)}%,var(--sf))`:''};${f>.5?'color:var(--bg)':''}">${i+1}</button>`}h+='</div>';
 const ph=PH.map((p,k)=>{const a=D.findIndex(x=>x.pi==k),b=D.map(x=>x.pi).lastIndexOf(k),q=pct(a,b);return`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span class="s" style="font-size:13px"><b>${k+1}. ${D[a].n}</b> <span class="mu">${sh(dt(a))}–${sh(dt(b))}</span></span><span class="mu">${Math.round(q*100)}%</span></div><div class="bar"><i style="width:${q*100}%"></i></div></div>`}).join('');
 return`<div class="c"><b class="s">All 179 days</b> <span class="mu">(tap a day; orange outline = today)</span><div style="margin-top:8px">${h}</div></div><div class="c"><b class="s">Phases</b>${ph}</div>`}
function prog(){const tot=Array.from({length:N},(_,i)=>fr(i)).reduce((a,b)=>a+b,0),H=sum(S.h,0,N),P=sum(S.p,0,N),X=sum(S.x,0,N),full=Array.from({length:N},(_,i)=>fr(i)==1).filter(Boolean).length;
 const gt=GT.map(g=>{const q=pct(0,g[0]-1);return`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span style="font-size:14px"><b class="s">${sh(dt(g[0]-1))}</b> · ${g[1]}</span><span class="mu">${Math.round(q*100)}%</span></div><div class="bar"><i style="width:${q*100}%"></i></div></div>`}).join('');
 return`<div class="c row" style="gap:18px">${ring(tot/N)}<div class="g" style="flex:1"><div class="k"><b>${full}</b>days fully done</div><div class="k"><b>${streak()}</b>day streak</div><div class="k"><b>${H}</b>hours logged</div><div class="k"><b>${P}</b>posts</div><div class="k"><b>${X}</b>interactions</div><div class="k"><b>${N-TI-1}</b>days to go</div></div></div>
 <div class="c"><b class="s">Progress vs plan</b>${line()}</div><div class="c"><b class="s">Weekly hours</b>${bars()}</div><div class="c"><b class="s">Monthly gates</b>${gt}</div>
 <div class="c"><b class="s">Weekly rhythm</b><ul class="mu"><li>Mon learning post · Tue specific comment · Wed teardown/lesson · Thu 60–120s video</li><li>Fri progress report · Sat build + feedback · Sun review &amp; plan</li></ul></div>`}
function lib(){return`<div class="c"><details open><summary>Links</summary><ul>${LIB.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a></li>`).join('')}</ul></details><details><summary>Books &amp; how to apply them</summary><ul>${BK.map(b=>`<li>${b}</li>`).join('')}</ul></details><details><summary>Product leaders to engage with</summary><ul>${LD.map(b=>`<li>${b}</li>`).join('')}</ul></details><details open><summary>If you fall behind · rules</summary><ul>${RULES.map(b=>`<li>${b}</li>`).join('')}</ul></details><details><summary>Your data</summary><p class="mu">Progress is saved in this browser only. Export before clearing data.</p><button class="b o" data-a="exp">Copy backup</button> <button class="b o" data-a="imp">Restore from clipboard</button></details></div>`}
function render(){$('#hd').textContent=`Day ${TI+1}/${N} · ${Math.round(Array.from({length:N},(_,i)=>fr(i)).reduce((a,b)=>a+b,0)/N*100)}% done`;
 $('#nv').innerHTML=[['today','Today'],['plan','Plan'],['prog','Progress'],['lib','Library']].map(t=>`<button class="${tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
 $('#v').innerHTML={today,plan,prog,lib}[tab]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='tab'){tab=t.dataset.v;render()}
 else if(a=='go'){sel=+t.dataset.v;tab='today';render();scrollTo(0,0)}
 else if(a=='tick'){const k=+t.dataset.k;S.d[sel]=S.d[sel]||[0,0,0];S.d[sel][k]=t.checked?1:0;sv();render()}
 else if(a=='rem'){try{localStorage.setItem('pmrt',$('#rt').value)}catch(x){}Notification.requestPermission().then(p=>{t.textContent=p=='granted'?'Reminder on ✓':'Permission denied'})}
 else if(a=='exp'){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>t.textContent='Copied ✓').catch(()=>t.textContent='Copy failed')}
 else if(a=='imp'){navigator.clipboard.readText().then(x=>{S=Object.assign({d:{},h:{},p:{},x:{},n:{}},JSON.parse(x));sv();render()}).catch(()=>t.textContent='Invalid backup')}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;S[f][sel]=f=='n'?e.target.value:e.target.value;sv()});
setInterval(()=>{try{const r=localStorage.getItem('pmrt');if(!r||Notification.permission!='granted')return;const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),k='pmn'+n.toDateString();if(hm==r&&!sessionStorage.getItem(k)){sessionStorage.setItem(k,1);new Notification('PM plan · Day '+(TI+1),{body:D[TI].c})}}catch(e){}},30000);
render();
</script></body></html>
